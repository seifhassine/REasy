name: Build and Package REasy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (preferably starts with "v")'
        required: true
      debug:
        description: 'Debug build: a console exe uploaded as an artifact, not signed or released'
        type: boolean
        default: false

  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    environment: REasy ENV
    permissions:
      id-token: write
      attestations: write
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.15'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Update Firebase config with secrets
      shell: pwsh
      run: |
        $filePath = "firebase/config/firebase_config.py"
        $content = Get-Content -Path $filePath -Raw
        $content = $content -replace '"apiKey":\s+"change-me"', '"apiKey": "${{ secrets.FIREBASE_API_KEY }}"'
        $content = $content -replace '"appId":\s+"change-me"', '"appId": "${{ secrets.FIREBASE_APP_ID }}"'
        Set-Content -Path $filePath -Value $content
    
    - name: Update version info
      shell: pwsh
      run: |
        if ($env:GITHUB_EVENT_NAME -eq "release") {
          $versionStr = "${{ github.event.release.tag_name }}"
        } else {
          $input = "${{ github.event.inputs.version }}"
          $versionStr = ($input -like "v*") ? $input : "v$input"
        }
        
        echo "release_version=$versionStr" >> $env:GITHUB_ENV
        
        $cleanVersion = $versionStr -replace '^v', ''
        $parts = $cleanVersion -split '\.'
        
        while ($parts.Count -lt 4) {
          $parts += "0"
        }
        
        $major = [int]$parts[0]
        $minor = [int]$parts[1]
        $patch = [int]$parts[2]
        $build = "0"
        $versionString = "$major.$minor.$patch.$build"
        echo "product_version=$versionString" >> $env:GITHUB_ENV
        
        $reasyContent = Get-Content -Path "app_config.py" -Raw
        $pythonVersion = "$major.$minor.$patch"
        $reasyContent = $reasyContent -replace 'CURRENT_VERSION\s*=\s*"[^"]+"', "CURRENT_VERSION = `"$pythonVersion`""
        Set-Content -Path "app_config.py" -Value $reasyContent
        
        $versionFile = Get-Content -Path "version.txt" -Raw
        
        $versionFile = $versionFile -replace 'filevers=\([^)]+\)', "filevers=($major, $minor, $patch, $build)"
        $versionFile = $versionFile -replace 'prodvers=\([^)]+\)', "prodvers=($major, $minor, $patch, $build)"
        
        $versionFile = $versionFile -replace "StringStruct\(u'FileVersion',\s*u'[^']+'\)", "StringStruct(u'FileVersion', u'$versionString')"
        $versionFile = $versionFile -replace "StringStruct\(u'ProductVersion',\s*u'[^']+'\)", "StringStruct(u'ProductVersion', u'$versionString')"
        
        Set-Content -Path "version.txt" -Value $versionFile -NoNewline
        Write-Host "Updated version.txt with version $versionString"
    
    - name: Run build.bat
      shell: cmd
      run: build.bat
      env:
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        REASY_DEBUG: ${{ inputs.debug }}

    - name: Upload unsigned artifact (for SignPath, or the debug build)
      id: upload_unsigned
      uses: actions/upload-artifact@v4
      with:
        name: REasy-${{ env.release_version }}${{ inputs.debug && '-debug' || '' }}
        path: dist/**

    - name: Submit signing request to SignPath (release cert)
      if: ${{ !inputs.debug }}
      id: sign
      uses: signpath/github-action-submit-signing-request@v1.2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
        project-slug: reasy
        signing-policy-slug: release-signing
        artifact-configuration-slug: Correct_Sample
        github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
        wait-for-completion: true
        parameters: |
          version: "${{ env.product_version }}"
        output-artifact-directory: reasy-signed

    - name: Zip signed output
      if: ${{ !inputs.debug }}
      shell: pwsh
      run: |
        Compress-Archive -Path reasy-signed\* `
                        -DestinationPath "reasy-signed\REasy-${{ env.release_version }}.zip" `
                        -Force
                        
    - name: Upload ZIP to GitHub Release (SIGNED)
      if: ${{ !inputs.debug }}
      uses: softprops/action-gh-release@v2
      with:
        name: "REasy ${{ env.release_version }}"
        tag_name: "${{ env.release_version }}"
        files: "reasy-signed/REasy-${{ env.release_version }}.zip"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload ZIP artifact (SIGNED)
      if: ${{ !inputs.debug }}
      uses: actions/upload-artifact@v4
      with:
        name: REasy ${{ env.release_version }}
        path: "reasy-signed/REasy-${{ env.release_version }}.zip"
